server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Azure's internal DNS (also falls back to a public resolver). A literal
    # hostname in proxy_pass resolves once at nginx startup and caches that IP
    # forever; if Azure later reassigns the backend App Service's IP (scaling,
    # restart, auto-heal), nginx keeps hammering the dead IP until every request
    # times out (504). Routing proxy_pass through a variable forces nginx to
    # re-resolve DNS per request instead.
    resolver 168.63.129.16 8.8.8.8 valid=30s;

    location /api-proxy/ {
        set $backend_host aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net;
        proxy_pass https://$backend_host/;
        proxy_ssl_server_name on;
        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        # Backend sits behind Azure's edge TLS termination and issues trailing-slash
        # redirects with an http:// Location even when reached over HTTPS, which the
        # browser blocks as mixed content. Rewrite any such redirect back to same-origin.
        proxy_redirect http://aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net/ /api-proxy/;
        proxy_redirect https://aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net/ /api-proxy/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
