server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api-proxy/ {
        proxy_pass https://aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Backend sits behind Azure's edge TLS termination and issues trailing-slash
        # redirects with an http:// Location even when reached over HTTPS, which the
        # browser blocks as mixed content. Rewrite any such redirect back to same-origin.
        proxy_redirect http://aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net/ /api-proxy/;
        proxy_redirect https://aigovernance-backend-api-dedgf7huf8e5ehh6.southindia-01.azurewebsites.net/ /api-proxy/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
